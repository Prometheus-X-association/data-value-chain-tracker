# Public gateway of the DVCT demonstrator: the only service with a published port.
# Terminate TLS in front of it (or here) for any deployment that is reachable by others.

limit_req_zone $binary_remote_addr zone=dvct_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=dvct_trace:10m rate=10r/s;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  # Redirects must not leak the internal port (8080) behind the published one.
  absolute_redirect off;
  client_max_body_size 1m;

  root /usr/share/nginx/html;
  index index.html;

  # Common proxy headers. Host keeps the port so the API can verify the request origin.
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Host $http_host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location = / {
    return 302 /core/;
  }

  location = /api/auth/login {
    limit_req zone=dvct_login burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://core-api:9081;
  }

  location /api/ {
    proxy_pass http://core-api:9081;
  }

  # PDC / workflow entry point: POST /trace-api/api/run-script (bearer token required)
  location /trace-api/ {
    limit_req zone=dvct_trace burst=20 nodelay;
    limit_req_status 429;
    proxy_read_timeout 90s;
    proxy_pass http://trace-api:9091/;
  }

  # Next.js (inline hydration scripts, wallet connectors): same headers without the CSP.
  # Next serves its base path without a trailing slash, so /incentive goes to it directly.
  location ~ ^/incentive(/|$) {
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    proxy_pass http://incentive-frontend:3000;
  }

  location = /core {
    return 301 /core/;
  }

  # The core SPA. Its routes fall back to /index.html, served with the server-level headers (incl. CSP).
  location /core/ {
    rewrite ^/core/(.*)$ /$1 break;
    try_files $uri $uri/ /index.html;
  }
}
